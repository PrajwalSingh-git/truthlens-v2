name: CI

# Runs on every push (including main) and every pull request — this is
# the check both GitHub branch protection and Render's "Auto-Deploy:
# After CI Checks Pass" setting look at. It never deploys anything
# itself; deploy-frontend.yml handles the frontend, and Render deploys
# the backend natively once this workflow reports success (see the
# CI/CD section in the README).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truthlens-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: truthlens-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truthlens-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: truthlens-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (this is the frontend's CI check — a broken build fails here)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build
